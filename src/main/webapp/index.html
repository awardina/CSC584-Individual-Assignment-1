<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Corner | Personal Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="website-container">

        <!-- Website Header -->
        <header class="site-header">

            <div class="header-decoration">
                ✿ ♡ ✧ ♡ ✿
            </div>

            <h1>my little corner</h1>

            <p class="subtitle">
                ~ welcome ~
            </p>

        </header>


        <!-- Personal Profile Form -->
        <main class="home-content">

            <section class="profile-box">

                <h2>✧  The Form  ✧</h2>

                <p class="form-description">
                    fill in the little details below~
                </p>

                <form action="ProfileServlet" method="post">

                    <label for="name">♡ Your Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your name"
                           required>

                    <label for="studentId">✿ Student ID</label>
                    <input type="text"
                           id="studentId"
                           name="studentId"
                           placeholder="Enter your student ID"
                           required>

                    <label for="programme">♡ Programme</label>
                    <input type="text"
                           id="programme"
                           name="programme"
                           placeholder="Enter your programme"
                           required>

                    <label for="email">✧ Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                    <label for="hobbies">✿ Hobbies</label>
                    <input type="text"
                           id="hobbies"
                           name="hobbies"
                           placeholder="Your favourite hobbies"
                           required>

                    <label for="introduction">
                        ♡ Short Self-Introduction
                    </label>
                    <textarea id="introduction"
                              name="introduction"
                              rows="5"
                              placeholder="Tell me a little about yourself..."
                              required></textarea>

                    <button type="submit" class="submit-button">
                        ♡ submit my profile ♡
                    </button>

                </form>

            </section>

        </main>


        <!-- Footer -->
        <footer class="site-footer">
            <p>✿ made with love ✿</p>
            <p>CSC584 Individual Assignment 1</p>
        </footer>

    </div>

</body>
</html>
